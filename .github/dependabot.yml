version: 2
updates:
  # Maven dependencies (Spring Boot, Camunda, JJWT, springdoc, ...)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # Major-version bumps of the framework anchors require a coordinated migration
    # and cannot be applied piecemeal: Camunda 7 depends on Spring Boot 3 / Spring 6,
    # and springdoc 3.x / Spring Boot 4 pull in incompatible autoconfigure modules.
    # Ignore majors for these so Dependabot stops opening un-mergeable PRs (minor and
    # patch updates still come through). Revisit if/when the project moves to Camunda 8.
    ignore:
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.camunda.bpm*:*"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch Spring updates into a single PR to reduce noise.
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
      camunda:
        patterns:
          - "org.camunda*"

  # GitHub Actions used by the workflows in this repo.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci

  # The base images in the multi-stage Dockerfile.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
