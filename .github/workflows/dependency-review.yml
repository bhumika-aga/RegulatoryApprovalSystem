name: Dependency Review

# Flags dependencies with known vulnerabilities (or disallowed licenses)
# introduced by a pull request, before they reach main.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # The action hard-fails unless the repository's Dependency Graph is enabled
    # (Settings -> Security & analysis). Keep this job non-blocking so it does not
    # gate merges until that setting is turned on; once enabled it reviews normally.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependencies
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
