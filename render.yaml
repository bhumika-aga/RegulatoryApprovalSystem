# Render Blueprint - Regulatory Approval System
# https://render.com/docs/blueprint-spec
#
# Create with New -> Blueprint. Render asks for the three `sync: false` secrets only then;
# for an existing service, set them under Environment. The free plan sleeps when idle, and
# the H2 database is in memory, so each restart starts with empty data.

services:
  - type: web
    name: regulatory-approval-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      # Required: JWT signing key (Base64 encoded, min 512-bit)
      # Generate with: openssl rand -base64 64
      - key: JWT_SECRET
        sync: false
      # Required: Camunda admin password
      - key: CAMUNDA_ADMIN_PASSWORD
        sync: false
      # Required: password of the seeded API users (admin, reviewer, manager, ...).
      # The app refuses to start without it.
      - key: AUTH_DEFAULT_PASSWORD
        sync: false
      # Render is fronted by Cloudflare, which puts the real client address in this
      # header; login rate limiting counts failed logins per that address.
      - key: CLIENT_IP_HEADER
        value: "CF-Connecting-IP"
      # Optional: browser origins allowed to call the API (comma-separated). Only needed
      # for a separate front end; change it if your service URL differs.
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://regulatory-approval-system.onrender.com"
      # The port Render routes traffic to; the application listens on 8080.
      - key: PORT
        value: "8080"
