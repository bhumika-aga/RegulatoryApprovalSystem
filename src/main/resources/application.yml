server:
  port: 8080
  servlet:
    context-path: /
  # Behind a reverse proxy (e.g. Render's), take the scheme and client address from the
  # proxy's X-Forwarded-* headers; Tomcat trusts them only from private/loopback addresses.
  forward-headers-strategy: native
  tomcat:
    threads:
      # Each request thread reserves a stack; 200 (the default) is far more than a
      # 512 MB instance needs or can afford.
      max: 50

spring:
  application:
    name: regulatory-approval-system

  # H2 In-Memory Database Configuration (with legacy mode for Camunda compatibility)
  datasource:
    url: jdbc:h2:mem:regulatory_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=LEGACY;NON_KEYWORDS=VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 Console (for debugging) - disabled by default; enabled only under the `dev`
  # profile (see application-dev.yml) so it is never exposed in production.
  h2:
    console:
      enabled: false
      path: /h2-console
      settings:
        web-allow-others: false

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# Camunda BPM Configuration
camunda:
  bpm:
    admin-user:
      id: admin
      # Required, no default: the Camunda webapp (Cockpit) login.
      password: ${CAMUNDA_ADMIN_PASSWORD}
      firstName: Admin
      lastName: User
    authorization:
      enabled: false
    database:
      schema-update: true
    history-level: full
    job-execution:
      enabled: true
      core-pool-size: 3
      max-pool-size: 10
    metrics:
      enabled: true
    webapp:
      application-path: /camunda
    generic-properties:
      properties:
        # Camunda locks a user after failed logins: for growing delays (3 s, 6 s, ... up to
        # 60 s), then permanently after login-max-attempts (default 10). That lets anyone keep
        # admin, the only Cockpit user, out of Cockpit by sending wrong passwords for it, so
        # the lock is off (no permanent lock, zero delay). Instead, failed webapp logins are
        # rate-limited per client address, like API logins (WebappLoginRateLimitFilter).
        login-max-attempts: 2147483647
        login-delay-max-time: 0
    client:
      # base-url defaults to this server's own engine REST API on the port it listens on.
      # Long-poll window (ms). A poll returns at once when a task is created, so this only
      # bounds idle polls, and with them how long shutdown waits for the last poll to end.
      async-response-timeout: 5000
      lock-duration: 60000
      max-tasks: 10
      worker-id: regulatory-worker-${random.uuid}

# JWT Security Configuration
# Required secrets have no usable defaults: the application refuses to start unless
# they are set, so a deployment can never run with credentials committed to this
# repository. (The empty defaults below make a missing variable a blank value, which
# fails validation with a clear message, instead of leaving "${...}" as a literal.)
#   JWT_SECRET               Base64 HS512 key, >= 64 bytes:  openssl rand -base64 64
#   CAMUNDA_ADMIN_PASSWORD   (above)
#   AUTH_DEFAULT_PASSWORD    password of the seeded API users, or one AUTH_<USER>_PASSWORD each
app:
  security:
    jwt:
      secret-key: ${JWT_SECRET:}
      expiration-ms: 86400000 # 24 hours
      refresh-expiration-ms: 604800000 # 7 days
      issuer: regulatory-approval-system
    # Login rate limiting (API and Camunda webapp) counts failures per client address.
    # Behind an edge proxy that many clients share (Render is fronted by Cloudflare), name
    # the header that carries the real client address, e.g. CF-Connecting-IP; leave blank
    # when clients connect directly, since a client could otherwise forge the header.
    client-ip-header: ${CLIENT_IP_HEADER:}
    # Users allowed to obtain a token. Roles here are authoritative — the client
    # cannot request roles. Passwords are hashed at startup and come from the
    # environment: a per-user AUTH_<USER>_PASSWORD, else AUTH_DEFAULT_PASSWORD (required).
    auth:
      users:
        - username: admin
          password: ${AUTH_ADMIN_PASSWORD:${AUTH_DEFAULT_PASSWORD:}}
          roles: [ ADMIN ]
          department: IT
        - username: reviewer
          password: ${AUTH_REVIEWER_PASSWORD:${AUTH_DEFAULT_PASSWORD:}}
          roles: [ REVIEWER ]
          department: OPERATIONS
        - username: manager
          password: ${AUTH_MANAGER_PASSWORD:${AUTH_DEFAULT_PASSWORD:}}
          roles: [ MANAGER ]
          department: OPERATIONS
        - username: senior.manager
          password: ${AUTH_SENIOR_MANAGER_PASSWORD:${AUTH_DEFAULT_PASSWORD:}}
          roles: [ SENIOR_MANAGER ]
          department: OPERATIONS
        - username: compliance
          password: ${AUTH_COMPLIANCE_PASSWORD:${AUTH_DEFAULT_PASSWORD:}}
          roles: [ COMPLIANCE ]
          department: COMPLIANCE
        - username: auditor
          password: ${AUTH_AUDITOR_PASSWORD:${AUTH_DEFAULT_PASSWORD:}}
          roles: [ AUDITOR ]
          department: AUDIT
  notification:
    email:
      enabled: false
    slack:
      enabled: false

# OpenAPI Documentation
# Off unless API_DOCS_ENABLED=true (or the dev profile), so a deployment does not
# publish its API description.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

# Actuator Configuration
# Only /actuator/health is publicly reachable (for the platform health check);
# info and metrics require an ADMIN token (see SecurityConfig).
# Health details are shown only to authenticated callers, never anonymously.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.enterprise.regulatory: DEBUG
    org.camunda: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
